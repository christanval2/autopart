services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: autoparts-api
    restart: unless-stopped
    ports:
      - "3005:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL:         postgresql://postgres:${POSTGRES_PASSWORD:-123}@postgres:5432/autopart_db
      REDIS_URL:            redis://:${REDIS_PASSWORD:-redispass}@redis:6379
      APP_URL:              http://localhost:3005
      ALLOWED_ORIGINS:      http://localhost:5173,http://localhost:3001,http://localhost:3005
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - autoparts-net

  postgres:
    image: postgres:16-alpine
    container_name: autoparts-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB:       autopart_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U postgres -d autopart_db"]
      interval: 5s
      timeout:  5s
      retries:  10
    networks:
      - autoparts-net

  redis:
    image: redis:7-alpine
    container_name: autoparts-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redispass} ping"]
      interval: 5s
      timeout:  5s
      retries:  10
    networks:
      - autoparts-net

  # Interface admin BullMQ
  bull-board:
    image: deadly0/bull-board
    container_name: autoparts-bull-board
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispass
    depends_on:
      - redis
    networks:
      - autoparts-net

  # Adminer (interface SQL légère)
  adminer:
    image: adminer
    container_name: autoparts-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - autoparts-net

volumes:
  postgres_data:
  redis_data:

networks:
  autoparts-net:
    driver: bridge
